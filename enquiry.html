<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cape Community Haven - Get Involved</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Cape Community Haven</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Our Programs</a></li>
                <li><a href="enquiry.html" class="active">Get Involved</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Volunteer & Sponsorship Enquiry</h2>
            <p>Interested in joining our mission? Please fill out the form below to become a volunteer or corporate
                sponsor.</p>

            <form action="#" method="post">
                <p>
                    <label for="fullname">Full Name:</label><br>
                    <input type="text" id="fullname" name="fullname" required>
                </p>
                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="enquiry-type">I want to participate as a:</label><br>
                    <select id="enquiry-type" name="enquiry_type">
                        <option value="volunteer">Volunteer</option>
                        <option value="sponsor">Corporate Sponsor</option>
                        <option value="donor">Individual Donor</option>
                    </select>
                </p>
                <p>
                    <label for="message">How would you like to help?</label><br>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </p>
                <p>
                    <button type="submit">Submit Enquiry</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Cape Community Haven. All Rights Reserved.</p>
    </footer>

</body>

</html>
